{% load static %}

<!doctype html>
<html lang="en">
<head>
    <link type="text/css" href="{% static 'ToDoApp/css/styles.css' %}" rel="stylesheet" />
     <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>To do list</title>
</head>
<body>
    <div class="wrapper">
         <time id="currentTime"></time>
        {% block content_form %}
        {% endblock %}
        <h2>{{title_article}}</h2>
        <div>
            {% if tasks %}
                <ul class="list_task">
                {% for task in tasks %}
                <li class="wrapperBtn">
                    <a href="{% url 'running_task' task.pk %}" class="btn"> V </a>
                    <a href="{% url 'update_task' task.pk %}" class="list__btn btn"> {{ task.description }} </a>
                    <a href="{% url 'delete_task' task.pk %}" class="btn"> X </a>
                </li>
                {% endfor %}
                </ul>
            {% else %}
                <h2>{{ text_article }}</h2>
            {% endif %}
        </div>
        <hr style="width: 400px;">
        {% block content_buttons %}
        {% endblock %}
    </div>
    <script src="{% static 'ToDoApp/js/script.js' %}"></script>
</body>
</html>
