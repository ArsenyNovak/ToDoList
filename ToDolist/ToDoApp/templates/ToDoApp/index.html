{% extends 'base.html' %}

{% block content %}
<div>
    {% if tasks %}
        <ul class="list_task">
        {% for task in tasks %}
        <li class="wrapperBtn">
            <button class="btn" type="submit"></button>
            <a href="{% url 'update_task' task.pk %}" class="list__btn btn"> {{ task.description }} </a>
            <a href="{% url 'delete_task' task.pk %}" class="btn"> X </a>
        </li>
        {% endfor %}
        </ul>
    {% else %}
        <h2>На сегодня нет задач, ты молодец</h2>
    {% endif %}
</div>
<ul class="wrapperBtn">
    <li><a href="{% url 'create_task' %}" class="btn">+</a></li>
    <li><a href="#" class="btn">Архив</a></li>
    <li><a href="#" class="btn">Будущие задачи</a></li>
</ul>
{% endblock %}
