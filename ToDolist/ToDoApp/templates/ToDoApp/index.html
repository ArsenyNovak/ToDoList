{% extends 'base.html' %}

{% block content_form %}
<form id="my_form" class="" action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <ul class="wrapper_form">
        <li>{{ form.description }}</li>
        <li>{{ form.time_running }}</li>
        <li>{{ form.importance }}</li>
        <li><a href="javascript:{}" onclick="document.getElementById('my_form').submit();"
               class="btn">Добавить задачу</a></li>
    </ul>
</form>
<hr style="width: 400px;">
{% endblock %}

{% block content_buttons %}
<ul class="wrapperBtn">
    <li><a href="{% url 'archive_tasks' %}" class="btn">Архив</a></li>
    <li><a href="{% url 'future_tasks' %}" class="btn">Будущие задачи</a></li>
</ul>
{% endblock %}
